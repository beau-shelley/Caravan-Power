; Caravan Power HUB - ESP32-S3-DevKitC-1 (N8R2 / N8R8 / N16R8 all fine)
; Wired to: 2x Victron VE.Direct, DS18B20 temps, ADS1115 tank taps, INA226 shunt,
; relays (pumps, inverter), IR LED/receiver (aircon), RS485 to the display.
[env:hub]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1      ; Serial = native USB, frees UART0 for RS485
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3   ; OdysseyLink + phones using the level page
  -D MQTT_MAX_PACKET_SIZE=6144
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  symlink://../lib/CaravanCommon
  bblanchon/ArduinoJson@^7.2.1
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit ADS1X15@^2.5.0
  knolleary/PubSubClient@^2.8
  links2004/WebSockets@^2.6.1
  crankyoldgit/IRremoteESP8266@^2.8.6
  h2zero/NimBLE-Arduino@^1.4.2
extra_scripts = pre:copy_web.py
