; Caravan Power HUB. Two boards are supported; pins are in src/pins.h.
;   pio run -e hub-esp32 -t upload   classic ESP32-WROOM-32 DevKit (30-pin, 4 MB)
;   pio run -e hub -t upload         ESP32-S3-DevKitC-1 (N8R2 / N8R8 / N16R8 all fine)
; Talks Bluetooth to the OdysseyLink, Victrons and thermometers; RS485 to the
; display; I2C to the MPU-6050 level sensor. Wired fallbacks: VE.Direct, DS18B20,
; ADS1115 tank taps, INA226 shunt, relays, IR LED/receiver.
[platformio]
default_envs = hub-s3-n16r8   ; the board in the van; CI builds all

[hub_common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17                       ; same standard as tests/, the PC simulator and the display
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2   ; OdysseyLink + diesel heater (each slot costs RAM)
  -D HUB_LEVEL_BLE=0                       ; 1 = also offer the level page over Bluetooth (needs ~10 KB RAM)
  -D MQTT_MAX_PACKET_SIZE=6144
  -D WEBSOCKETS_SERVER_CLIENT_MAX=3    ; phones / web pages at once (each costs RAM the classic ESP32 lacks)
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  symlink://../lib/CaravanCommon
  bblanchon/ArduinoJson@^7.2.1
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit ADS1X15@^2.5.0
  knolleary/PubSubClient@^2.8
  links2004/WebSockets@^2.6.1
  crankyoldgit/IRremoteESP8266@^2.8.6
  h2zero/NimBLE-Arduino@^1.4.2
extra_scripts = pre:copy_web.py

; Classic ESP32 DevKit (CH340 USB-C or CP2102 micro-USB). Serial logs and
; flashing go through the board's USB port; RS485 uses UART2.
[env:hub-esp32]
extends = hub_common
board = esp32dev
board_build.partitions = huge_app.csv   ; 3 MB app (firmware is ~1.4 MB), ~900 KB LittleFS, no OTA
board_upload.flash_size = 4MB
; Wi-Fi off on the classic ESP32: with two Bluetooth links its RAM runs out
; on Wi-Fi within minutes and the network watchdog restarts it (display link
; drops). The display board does the cloud, alerts and the clock instead.
build_flags =
  ${hub_common.build_flags}
  -D HUB_WIFI=0

; Same classic ESP32 hub, but every sensor is replaced by made-up readings that
; change over time (a 10-minute "day" of sun, pumps draining Tank 1, the fridge
; cycling). They travel to the display over the real RS485 link, so a bench
; setup shows exactly how live data flows.  pio run -e hub-esp32-demo -t upload
[env:hub-esp32-demo]
extends = env:hub-esp32
build_flags =
  ${hub_common.build_flags}
  -D HUB_DEMO_MODE=1

; Real hub, but Bluetooth is LISTEN-ONLY: a passive scan that logs every advert
; (BMPRO, Victrons, heater...) to USB serial, never pairs/connects/transmits to
; another device, and never starts the BMPRO link. For the first van visit.
;   pio run -e hub-esp32-survey -t upload; pio device monitor -f log2file
[env:hub-esp32-survey]
extends = env:hub-esp32
build_flags =
  ${hub_common.build_flags}
  -D HUB_BLE_SURVEY=1

[env:hub]
extends = hub_common
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
  ${hub_common.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1      ; Serial = native USB, frees UART0 for RS485

; ESP32-S3 N16R8 (16 MB quad flash, 8 MB octal PSRAM): the van's hub from
; 2026-11-25, replacing the classic ESP32 that ran out of RAM. With PSRAM
; there is room for Wi-Fi, both Bluetooth links and the cloud TLS link, so
; this hub runs the cloud MQTT link and push alerts itself (CLOUD_ON_DISPLAY 0;
; the display's own cloud link must then be off). Plug into the board's "USB"
; port (native USB, shows as a USB Serial Device).
;   pio run -e hub-s3-n16r8 -t upload; pio run -e hub-s3-n16r8 -t uploadfs
[env:hub-s3-n16r8]
extends = env:hub
board_build.arduino.memory_type = qio_opi   ; octal PSRAM uses GPIO 35-37 too
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv   ; 6.5 MB app x2 (OTA), ~3.4 MB LittleFS
board_upload.flash_size = 16MB
upload_port = COM5
monitor_port = COM5
custom_expected_mac = 44:bd:8d:73:0c:4c
extra_scripts = pre:copy_web.py, post:../tools/upload_guard.py
build_flags =
  ${env:hub.build_flags}
  -D BOARD_HAS_PSRAM
  -D CLOUD_ON_DISPLAY=0
  -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1   ; Bluetooth host buffers in PSRAM: keeps a ~40 KB internal block free for TLS
