; Caravan Power DISPLAY - Waveshare ESP32-S3-Touch-LCD-7B (1024x600, GT911 touch)
; Talks to the hub over the board's on-board RS485 port. With the ESP32-S3 hub
; (CLOUD_ON_DISPLAY 0 in secrets.h) the display's Wi-Fi and CAN logger are off:
; it only draws the UI. With the classic ESP32 hub (CLOUD_ON_DISPLAY 1) it also
; runs Wi-Fi, the cloud MQTT link and ntfy push alerts.
[env:display]
; Pinned (2026-11-20): the "stable" link moved to ESP-IDF 6 and broke the build. 55.03.39 = Arduino 3.3.9 / IDF 5.5.4, what the display runs.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Beau's Surface: display on COM3 (CH343), hub on COM5. Never auto-detect: with
; custom_sdkconfig, pioarduino re-runs itself and the inner run dropped
; --upload-port and flashed the hub (2026-11-26). The guard checks the MAC.
upload_port = COM3
monitor_port = COM3
custom_expected_mac = 44:1b:f6:95:36:28
extra_scripts = post:../tools/upload_guard.py
board_build.f_cpu = 240000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
; Keep existing NVS and application partition offsets; the chip has 16 MB.
board_build.partitions = default_8MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
custom_sdkconfig =
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=12000
  CONFIG_SPIRAM_RODATA=y
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
  '# CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP is not set'
build_flags =
  -std=gnu++17                       ; same standard as tests/ and the PC simulator
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
  -D CORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
lib_deps =
  symlink://../lib/CaravanCommon
  bblanchon/ArduinoJson@^7.2.1
  lvgl/lvgl@8.3.11
  knolleary/PubSubClient@^2.8

[env:display-demo]
extends = env:display
build_flags =
  ${env:display.build_flags}
  -D DISPLAY_DEMO_MODE=1
