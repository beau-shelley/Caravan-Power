; Caravan Power DISPLAY - Waveshare ESP32-S3-Touch-LCD-7 (800x480, GT911 touch)
; Talks to the hub over the board's on-board RS485 port.
[env:display]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi     ; 8 MB octal PSRAM (framebuffer)
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.f_flash = 80000000L
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17                       ; same standard as tests/ and the PC simulator
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  -D LGFX_USE_V1
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  symlink://../lib/CaravanCommon
  bblanchon/ArduinoJson@^7.2.1
  lvgl/lvgl@8.3.11
  lovyan03/LovyanGFX@1.1.16
