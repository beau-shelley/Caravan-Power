<text x="1165" y="362" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Display</text>
<text x="1165" y="380" font-size="12" text-anchor="middle" fill="#111">RS485 A</text>
<text x="1165" y="406" font-size="12" text-anchor="middle" fill="#111">RS485 B</text>
<path d="M1070,372 H1110" stroke="#5c940d" stroke-width="3.5"/>
<path d="M1070,398 H1110" stroke="#e67700" stroke-width="3.5"/>
<text x="760" y="560" font-size="16" font-weight="700" fill="#111">Notes</text>
<text x="760" y="584" font-size="13" font-weight="700" fill="#111">Power</text>
<text x="840" y="584" font-size="13" fill="#333">5V pin from the buck, GND to GND. Only one power source at a</text>
<text x="840" y="601" font-size="13" fill="#333">time: unplug the 12 V buck while USB is plugged in, or vice</text>
<text x="840" y="618" font-size="13" fill="#333">versa.</text>
<text x="760" y="643" font-size="13" font-weight="700" fill="#111">MAX485</text>
<text x="840" y="643" font-size="13" fill="#333">Power it from 3V3 (not 5 V) so its RO output is safe for the</text>
<text x="840" y="660" font-size="13" fill="#333">ESP32. DE and RE get separate wires; a module with them tied</text>
<text x="840" y="677" font-size="13" fill="#333">uses 42 only.</text>
<text x="760" y="702" font-size="13" font-weight="700" fill="#111">MPU-6050</text>
<text x="840" y="702" font-size="13" fill="#333">3V3 power. Mount it flat and square to the van; levelling and</text>
<text x="840" y="719" font-size="13" fill="#333">the theft alarm use it.</text>
<text x="760" y="744" font-size="13" font-weight="700" fill="#111">Ground</text>
<text x="840" y="744" font-size="13" fill="#333">All GNDs are joined: board, buck, MPU-6050, MAX485.</text>
<text x="760" y="779" font-size="16" font-weight="700" fill="#111">Optional extras (grey pins, wire later if needed)</text>
<text x="770" y="801" font-size="13" fill="#333">4  DS18B20 1-Wire data (4.7 k pull-up to 3V3)</text>
<text x="770" y="819" font-size="13" fill="#333">5 / 6  IR LED driver / IR receiver (aircon)</text>
<text x="770" y="837" font-size="13" fill="#333">7  buzzer (via transistor)</text>
<text x="770" y="855" font-size="13" fill="#333">12  inverter relay      47  inverter 240 V sense</text>
<text x="80" y="940" font-size="12" fill="#666">Pin order is the Espressif DevKitC-1 layout most N16R8 boards copy. Check the silkscreen labels on your board before soldering wires.</text>
</svg>