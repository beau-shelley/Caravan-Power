name: build

on:
  # Run once per push (the result also shows on any open PR for that branch).
  # There is no separate pull_request trigger: it re-ran the same ~15 min build
  # for every push to a PR branch and doubled the failure emails.
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "hardware/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ArduinoJson + LVGL
        run: |
          git clone --depth 1 -b v7.2.1 https://github.com/bblanchon/ArduinoJson ../ArduinoJson
          git clone --depth 1 -b v8.3.11 https://github.com/lvgl/lvgl ../lvgl
      - name: Unit tests (ASan/UBSan)
        run: make -C tests ARDUINOJSON=$PWD/../ArduinoJson
      - name: Render display UI screenshots
        run: make -j4 -C tests/sim LVGL=$PWD/../lvgl ARDUINOJSON=$PWD/../ArduinoJson
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/sim/out/*.ppm

  firmware:
    runs-on: ubuntu-latest
    strategy:
      # Let hub and display each finish, so one failure doesn't hide the other's result.
      fail-fast: false
      matrix:
        project: [hub, display]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.project }}-${{ hashFiles(format('firmware/{0}/platformio.ini', matrix.project)) }}
      - run: pip install platformio
      - name: Build ${{ matrix.project }}
        working-directory: firmware/${{ matrix.project }}
        env:
          # The pioarduino platform (display) installs the newest "pioarduino" core into
          # ~/.platformio/penv for its nested build. 6.2.0.post1 reports itself as
          # 6.2.0-post.1, which fails the platform's own ">=6.2.0" check
          # (IncompatiblePlatform). Its installer uses uv, so pin it here.
          UV_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
        # hub: the S3 N16R8 van board, the classic ESP32 boards and the generic S3 hub
        run: pio run ${{ matrix.project == 'hub' && '-e hub-s3-n16r8 -e hub-esp32 -e hub-esp32-survey -e hub' || '' }}
