name: android

on:
  # Manual only (Actions tab > android > Run workflow): the free minutes for this
  # private repo ran out, so app builds are done on the Surface instead
  # (tools/build-app.ps1).
  workflow_dispatch:

permissions:
  contents: write   # to publish each build as a GitHub release for the in-app updater

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk caravan-monitor-${GITHUB_SHA::7}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: caravan-monitor-apk
          path: android/caravan-monitor-*.apk
          if-no-files-found: error
      # The app checks these releases for updates (android/.../Updater.kt).
      # Tag app-build-<run number>; the build number is also the APK's versionCode.
      - name: Publish as a release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%s "$GITHUB_SHA" > notes.txt
          echo "" >> notes.txt
          echo "Branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}." >> notes.txt
          gh release create "app-build-${GITHUB_RUN_NUMBER}" caravan-monitor-*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Caravan app build ${GITHUB_RUN_NUMBER}" --notes-file notes.txt
          # Keep the 10 newest app builds.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^app-build-' | sort -t- -k3 -n -r | tail -n +11 \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
